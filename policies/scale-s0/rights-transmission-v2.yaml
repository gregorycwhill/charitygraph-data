{"policy_id":"scale-s0-rights-transmission-boundary-v2","policy_version":"2","mandate_authority":"authorises a bounded source-family universe and the adopted open-web analysis policy. It does not clear technically withheld or separately licensed/controlled sources.","source_authorisation_required":"every concrete source has immutable identity, acquisition/representation state, and packet-bound provenance before use. OPEN_WEB_PUBLIC sources use the adopted policy; separately licensed/controlled sources require their exact source authority.","access_classifications":["OPEN_WEB_PUBLIC","TECHNICALLY_WITHHELD","SEPARATELY_LICENSED_OR_CONTROLLED"],"open_web_public_rule":"Content intentionally accessible on the open web without authentication, paywall, effective access control, challenge, or equivalent technical restriction is eligible for automated acquisition, governed local retention, parsing/rendering, bounded task-packet transmission to an authorised provider, and analysis. Restrictive prose, copyright notices, robots.txt, or data-mining language are provenance/governance metadata, not an execution veto under the adopted CharityGraph policy.","technical_withholding_rule":"Authentication, paywalls, credentials, private portals, access tokens, CAPTCHAs or anti-bot mechanisms blocking the authorised path, explicit technical denial, and comparable deliberate technical restriction are TECHNICALLY_WITHHELD. Do not bypass or circumvent them.","separately_controlled_rule":"Authenticated APIs, paid/licensed databases, bulk datasets under distinct licence, private registries, credentialed specialist systems, and other controlled mechanisms require their applicable source-specific authority.","robots_rule":"robots.txt is technical metadata and may affect implementation; it is neither copyright permission nor a CharityGraph rights veto by itself.","dimensions":["access","local_acquisition_retention","local_processing","provider_transmission"],"provider_transmission_rule":"Transmit only frozen, task-bounded, data-minimised packets with source/evidence lineage, provider configuration, and spend/reservation controls; do not transmit unnecessary whole-site corpora.","document_rule":"An openly downloadable unauthenticated public document is eligible under the open-web policy. Representation controls still require reliable text or selected rendered pages where visually material, and must record parsing/representation failure without false not_found.","unknown_or_withheld_before_crossing":"record the precise unavailable, access-blocked, rights_not_authorised, not_acquired, parsing, or representation state; continue independently authorised work where valid; never infer substantive absence.","attempted_controlled_source_violation":"hard halt under the halt policy; do not silently convert an attempted prohibited acquisition or transmission into an ordinary skip.","specialist_rule":"family approval authorises only the trigger class; every actual separately controlled specialist source requires central source authorisation and its own exact authority"}
