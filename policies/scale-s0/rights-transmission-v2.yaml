{"policy_id":"scale-s0-rights-transmission-boundary-v2","policy_version":"2","mandate_authority":"authorises only a bounded source-family universe and a fail-closed process for source-specific rights resolution; it does not clear any URL, document, representation, provider send, or specialist source","source_authorisation_required":"every concrete source has an immutable SourceAuthorisation and exact artifact-bound rights/retention decisions before its applicable acquisition, retention, processing, or provider boundary","permission_vocabulary":["EXPLICITLY_PERMITTED","PERMITTED_BY_ADOPTED_INTERNAL_POLICY","CONDITIONALLY_PERMITTED","NO_PROHIBITION_FOUND","UNKNOWN","EXPLICITLY_PROHIBITED","ACCESS_REQUIRES_AUTHENTICATION","NOT_APPLICABLE"],"dimensions":["access","local_acquisition_retention","local_processing","provider_transmission"],"minimum_for_local_acquisition_or_retention":["EXPLICITLY_PERMITTED","PERMITTED_BY_ADOPTED_INTERNAL_POLICY","CONDITIONALLY_PERMITTED"],"minimum_for_local_processing":["EXPLICITLY_PERMITTED","PERMITTED_BY_ADOPTED_INTERNAL_POLICY","CONDITIONALLY_PERMITTED"],"minimum_for_provider_transmission":["EXPLICITLY_PERMITTED","PERMITTED_BY_ADOPTED_INTERNAL_POLICY"],"state_constraints":"CONDITIONALLY_PERMITTED requires its recorded condition to be satisfied; NO_PROHIBITION_FOUND is never affirmative permission; UNKNOWN, EXPLICITLY_PROHIBITED, and ACCESS_REQUIRES_AUTHENTICATION never cross acquisition, retention, processing, or provider boundaries without a separate recorded authority","structured_source_rule":"a specifically licensed structured resource or one exact source-native factual record may proceed only after its exact source record, access, retention, processing, and provider-transmission decisions pass; an ACNC API response does not inherit a bulk-dataset licence absent an exact binding","web_page_excerpt_rule":"only an exact bounded attributable excerpt may be retained or transmitted after source-specific clearance; public URL access and robots metadata do not grant copyright or provider permission","visual_page_rule":"only selected rendered pages may be transmitted after source-specific clearance and representation approval","full_document_rule":"complete or near-complete documents are prohibited by default; they require a separate affirmative exact-document authority and may not be inferred from excerpt, page, or local-processing authority","unknown_or_prohibited_before_crossing":"skip the source, record rights_not_authorised/not_acquired or the precise coverage state, continue independently authorised work where valid, and never infer substantive absence","attempted_policy_violation":"hard halt under the halt policy; do not silently convert an attempted prohibited acquisition or transmission into an ordinary skip","specialist_rule":"family approval authorises only the trigger class; every actual specialist source requires central source authorisation and its own exact rights decisions"}
